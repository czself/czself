<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">RM2026 infantry control loop</title>
  <desc id="desc">Remote input drives robot behavior, motor control and robot actuation. Encoder and IMU feedback return to behavior and motor control.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker></defs>
  <style>@keyframes signal { to { stroke-dashoffset: -24; } } .feedback { stroke-dasharray: 5 7; animation: signal 3s linear infinite; } @media (prefers-reduced-motion: reduce) { .feedback { animation: none; } }</style>
  <rect x="1" y="1" width="1198" height="328" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="32" y="43" fill="#9198a1" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2.5">RM2026 / INFANTRY CONTROL LOOP</text>
  <g fill="#11161d" stroke="#30363d">
    <rect x="32" y="94" width="244" height="102" rx="8"/>
    <rect x="328" y="94" width="244" height="102" rx="8"/>
    <rect x="624" y="94" width="244" height="102" rx="8"/>
    <rect x="920" y="94" width="248" height="102" rx="8"/>
  </g>
  <g fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="middle">
    <text x="154" y="135">Remote input</text>
    <text x="450" y="135">Robot behavior</text>
    <text x="746" y="135">Motor control</text>
    <text x="1044" y="135">Robot</text>
  </g>
  <g fill="#9198a1" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">
    <text x="154" y="168">Protocol / mode mapping</text>
    <text x="450" y="168">Chassis · Gimbal · Shoot</text>
    <text x="746" y="168">PID · CAN output</text>
    <text x="1044" y="168">Motion · Aim · Feed</text>
  </g>
  <g fill="none" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)">
    <path d="M282 145h38"/>
    <path d="M578 145h38"/>
    <path d="M874 145h38"/>
    <path class="feedback" d="M1044 202v78H450v-78"/>
    <path d="M746 280v-78"/>
  </g>
  <rect x="810" y="260" width="165" height="36" fill="#0d1117"/>
  <text x="892" y="282" fill="#9198a1" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle">Encoder / IMU</text>
  <circle cx="746" cy="280" r="4" fill="#e6edf3"/>
</svg>
